[project]
name = "stacks-prediction-hub"
description = "Decentralized prediction market platform on Stacks blockchain"
authors = []
telemetry = true
cache_dir = "./.cache"

[repl.analysis]
passes = ["check_checker"]
check_checker = { trusted_sender = false, trusted_caller = false, callee_filter = false }

[contracts]

[contracts.binary-market]
path = "contracts/binary-market.clar"
clarity_version = 2
epoch = 2.5

[contracts.categorical-market]
path = "contracts/categorical-market.clar"
clarity_version = 2
epoch = 2.5

[contracts.market-resolver]
path = "contracts/market-resolver.clar"
clarity_version = 2
epoch = 2.5

[contracts.liquidity-engine]
path = "contracts/liquidity-engine.clar"
clarity_version = 2
epoch = 2.5

[contracts.rewards-distributor]
path = "contracts/rewards-distributor.clar"
clarity_version = 2
epoch = 2.5
